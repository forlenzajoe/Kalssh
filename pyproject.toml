[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-weather-scanner"
version = "0.1.0"
description = "Research/backtesting/paper-trading scanner for Kalshi weather markets (no live trading)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joe Forlenza" }]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
kalshi-scan = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
